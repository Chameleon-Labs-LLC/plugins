name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Marketplace and plugin structure
        run: |
          python3 - <<'EOF'
          import json, os, sys
          errors = []
          mp = json.load(open('.claude-plugin/marketplace.json'))
          for entry in mp['plugins']:
              name, src = entry['name'], entry['source']
              if isinstance(src, str) and src.startswith('./'):
                  root = src[2:]
                  pj_path = os.path.join(root, '.claude-plugin', 'plugin.json')
                  if not os.path.isfile(pj_path):
                      errors.append(f"{name}: missing {pj_path}")
                      continue
                  pj = json.load(open(pj_path))
                  if pj['name'] != name:
                      errors.append(f"{name}: plugin.json name mismatch ({pj['name']})")
                  if pj.get('version') != entry.get('version'):
                      errors.append(f"{name}: version mismatch plugin.json={pj.get('version')} marketplace={entry.get('version')}")
                  skills_dir = os.path.join(root, 'skills')
                  if os.path.isdir(skills_dir):
                      for sk in sorted(os.listdir(skills_dir)):
                          if not os.path.isfile(os.path.join(skills_dir, sk, 'SKILL.md')):
                              errors.append(f"{name}: skills/{sk} lacks SKILL.md")
          for e in errors:
              print('ERROR:', e)
          print(f"checked {len(mp['plugins'])} marketplace entries")
          sys.exit(1 if errors else 0)
          EOF

      - name: version-manager test suite
        run: |
          pip install pytest
          python3 -m pytest repo-hygiene/skills/version-manager/tests/ -q

  line-endings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No CRLF in the index (bash cannot run CRLF scripts)
        run: |
          bad="$(git ls-files --eol | awk '$1 == "i/crlf" {print $NF}')"
          if [ -n "$bad" ]; then echo "CRLF files in the index:"; echo "$bad"; exit 1; fi
          echo "all tracked text files are LF"

  shell-scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check (macOS runs the stock /bin/bash 3.2)
        run: |
          /bin/bash --version | head -1
          for f in scan-source/skills/scan-source/scripts/scan-download \
                   scan-source/skills/scan-source/scripts/install-security-scanners.sh \
                   yt-transcript/skills/yt-transcript/scripts/run.sh tests/*.sh; do
            /bin/bash -n "$f" || exit 1
            echo "ok $f"
          done
      - name: shellcheck (errors only)
        if: runner.os == 'Linux'
        run: |
          shellcheck -S error scan-source/skills/scan-source/scripts/scan-download \
            scan-source/skills/scan-source/scripts/install-security-scanners.sh \
            yt-transcript/skills/yt-transcript/scripts/run.sh tests/*.sh
      - name: scan-download smoke test
        run: /bin/bash tests/smoke-scan-download.sh
      - name: scan-download smoke test without timeout/gtimeout
        run: /bin/bash tests/smoke-scan-download.sh --no-timeout

  cross-platform-python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # version_tool reads the tag/commit history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: version-manager tests
        run: |
          python -m pip install pytest
          python -m pytest repo-hygiene/skills/version-manager/tests/ -q
      # Piped stdout is cp1252 on Windows; these used to crash on non-ASCII output.
      - name: repo-doctor and version_tool print through a pipe
        run: |
          # audit.py exits 1 on findings, which is also a crash's exit code, so
          # also look for a traceback. Exit 2 means a bad --repo path.
          for cmd in "repo-hygiene/skills/repo-doctor/audit.py --repo $PWD" \
                     "repo-hygiene/skills/version-manager/version_tool.py --repo $PWD check"; do
            rc=0; out="$(python $cmd 2>&1)" || rc=$?
            printf '%s\n' "$out" | tail -3
            if [ "$rc" -gt 1 ] || printf '%s\n' "$out" | grep -q Traceback; then
              echo "failed (exit $rc): $cmd"; exit 1
            fi
          done
      - name: extract_symbols
        run: |
          python docs-toolkit/skills/update-code-map/references/extract_symbols.py \
            --root repo-hygiene --out "$RUNNER_TEMP/inventory.json" | tail -1
      - name: yt-transcript run.sh smoke test
        run: bash tests/smoke-yt-transcript.sh
