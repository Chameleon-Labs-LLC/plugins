# Dependabot: free, GitHub-side dependency and advisory monitoring.
#
# Shape:
#   - Security updates are grouped into ONE PR per ecosystem so a bad week does
#     not open fifteen PRs.
#   - Version updates run weekly, minor+patch only, grouped. Majors are done by
#     hand with a changelog read. The `ignore` of semver-major below gates
#     VERSION updates only: SECURITY updates walk past it, so a security fix
#     that lives in a new major still arrives as a PR. "No PR" never means
#     "no vulnerability" -- transitive-only deps and advisories with no fixed
#     version show up only as alerts. Read the alerts.
#   - cooldown mirrors the 7-day minimum-package-age rule for version updates.
#     Security updates are not delayed by cooldown: remediation wins.
#   - A Dependabot PR carries no version bump; fold it into the next release.
#
# ROLLOUT NOTE: keep only the ecosystems this repo actually has, and set
# `directory`/`directories` to where the manifests really live. A pip block
# deliberately omits `update-types` from its version-update group: projects
# that declare loose floors (`httpx>=0.27`) get REQUIREMENT changes, which
# carry no from->to pair and therefore match NO `update-types` value -- adding
# the filter silently drops every such update out of the group and opens one PR
# each.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: America/Chicago
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      # No `applies-to: security-updates` group here: it could never fire,
      # because SHA-pinned actions get no Dependabot alerts.
      actions:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # NO semver-major ignore here, unlike the other ecosystems, and that is
    # deliberate. GitHub generates Dependabot alerts only for actions on
    # semantic versions, NOT for SHA pins (docs: "About Dependabot alerts"),
    # so no security update can ever fire for a pinned action. A weekly
    # VERSION update is therefore the only remediation path that exists, and
    # ignoring majors would remove it. Advisory DETECTION comes from the
    # `github/actions` osv-scanner plugin named in security.yml.
